<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Traktor Mix Library</title>
  <link rel="icon" href="images.jpg">
  <style>
    :root{--green:#1ed760;--bg:#0b0b0c;--panel:#181818}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font:16px Arial,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,#121212,#090909)}
    .card{width:min(760px,94vw);display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:center;background:var(--panel);border-radius:18px;padding:30px;box-shadow:0 20px 60px #0008}
    .cover{width:230px;height:230px;object-fit:cover;border-radius:12px;box-shadow:0 12px 30px #0009}
    h1{font-size:42px;margin:0 0 10px}.meta{color:#b3b3b3;margin-bottom:28px}
    .download{display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#07110a;text-decoration:none;font-weight:800;border-radius:999px;padding:16px 28px;font-size:18px}
    .download:hover{transform:scale(1.03);filter:brightness(1.08)}
    .download:active{transform:scale(.98)}
    .footer{margin-top:22px;color:#8c8c8c;font-size:13px}
    @media(max-width:680px){.card{grid-template-columns:1fr;text-align:center}.cover{margin:auto}}
  </style>
</head>
<body><main><section class="card">
  <img class="cover" src="images.jpg" alt="Traktor Mix Library">
  <div><h1>Traktor Mix Library</h1>
  <div class="meta">61 utworów • synchronizacja biblioteki • Bass Boost</div>
  <a class="download" href="TraktorMixPlayer.exe" download>Pobierz aplikację</a>
  <div class="footer">Windows • bez instalatora • aplikacja aktualizuje bibliotekę</div></div>
</section></main></body></html>
